name: Apply PIUMTech model patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-piumtech-model-patch.yml'
      - 'tools/apply_piumtech_model_patch.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python tools/apply_piumtech_model_patch.py

      - name: Commit patched app.py
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Upgrade PIUMTech text and image models"
          git push origin HEAD:main
