name: Patent drawing fix validation
on:
  push:
    branches: [fix/patent-drawing-selection-20261013]
permissions:
  contents: read
jobs:
  source-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Export source snapshot for validation
        uses: actions/upload-artifact@v4
        with:
          name: drawing-fix-source
          path: |
            app.py
            requirements.txt
            logo.zip
            PIUMLINK.png
            assets/reference/
          retention-days: 1
