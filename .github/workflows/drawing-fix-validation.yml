name: Patent drawing fix validation
on:
  push:
    branches: [fix/patent-drawing-selection-20261013]
permissions:
  contents: write
jobs:
  source-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply guarded app integration
        run: python scripts/apply_drawing_fix.py
      - name: Install validation dependencies
        run: python -m pip install 'pymupdf>=1.24' 'pillow>=10' numpy matplotlib python-pptx requests
      - name: Validate source and run regression tests without external AI calls
        run: |
          python -m py_compile app.py patent_drawing.py smk_drawing_assets.py
          python -m unittest discover -s tests -v 2>&1 | tee drawing-test-results.txt
        shell: bash
      - name: Commit tested app integration on isolated fix branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'fix: integrate verified patent drawing selection and document-scoped output'
          git push origin HEAD:fix/patent-drawing-selection-20261013
      - name: Export tested sources
        uses: actions/upload-artifact@v4
        with:
          name: drawing-fix-tested
          path: |
            app.py
            patent_drawing.py
            smk_drawing_assets.py
            tests/
            drawing-test-results.txt
          retention-days: 1
